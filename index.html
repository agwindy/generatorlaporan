<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Laporan Totalisator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      margin: 0;
      padding: 16px;
      color: #333;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      max-width: 600px;
      margin: 0 auto;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
      color: #b91c1c;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Kunci Responsif: Pembungkus tabel dengan scroll horizontal */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 480px; /* Menjaga ukuran minimum agar input tidak terhimpit */
    }

    th {
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      text-transform: uppercase;
      text-align: left;
      padding: 8px 6px;
      border-bottom: 2px solid #e5e7eb;
      white-space: nowrap;
    }

    td {
      padding: 6px;
      vertical-align: middle;
      white-space: nowrap;
      font-size: 13px;
    }

    .fuel-label {
      font-weight: 600;
      color: #1f2937;
    }

    .machine-label {
      color: #4b5563;
      font-weight: 500;
      text-align: center;
    }

    /* Styling elemen Input */
    input[type="number"] {
      width: 100%;
      min-width: 70px;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      background-color: #f9fafb;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #b91c1c;
      background-color: #fff;
    }

    input[readonly] {
      background-color: #f3f4f6;
      color: #6b7280;
      border-color: #e5e7eb;
    }

    .total-val {
      font-weight: 600;
      color: #111827;
    }

    .section-divider {
      border-top: 2px solid #ef4444;
      margin: 12px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-title">
    <span>⏱️</span> Totalisator Nozzle
  </div>

  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>PRODUK</th>
          <th style="text-align: center;">MESIN</th>
          <th>TOT. AWAL</th>
          <th>TOT. AKHIR</th>
          <th>PENJUALAN</th>
          <th>TOTAL</th>
        </tr>
      </thead>
      <tbody>
        <!-- Pertalite -->
        <tr>
          <td class="fuel-label" rowspan="3">Pertalite</td>
          <td class="machine-label">A1</td>
          <td><input type="number" placeholder="Awal" oninput="hitungPenjualan(this)"></td>
          <td><input type="number" placeholder="Akhir" oninput="hitungPenjualan(this)"></td>
          <td><input type="number" placeholder="auto" readonly class="penjualan"></td>
          <td class="total-val">Rp 0</td>
        </tr>
        <tr>
          <td class="machine-label">A2</td>
          <td><input type="number" placeholder="Awal" oninput="hitungPenjualan(this)"></td>
          <td><input type="number" placeholder="Akhir" oninput="hitungPenjualan(this)"></td>
          <td><input type="number" placeholder="auto" readonly class="penjualan"></td>
          <td class="total-val">Rp 0</td>
        </tr>
        <tr>
          <td class="machine-label">C</td>
          <td><input type="number" placeholder="Awal" oninput="hitungPenjualan(this)"></td>
          <td><input type="number" placeholder="Akhir" oninput="hitungPenjualan(this)"></td>
          <td><input type="number" placeholder="auto" readonly class="penjualan"></td>
          <td class="total-val">Rp 0</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  function hitungPenjualan(input) {
    const row = input.closest('tr');
    const inputs = row.querySelectorAll('input[type="number"]');
    const awal = parseFloat(inputs[0].value) || 0;
    const akhir = parseFloat(inputs[1].value) || 0;
    const inputPenjualan = inputs[2];

    if (akhir >= awal && inputs[1].value !== "") {
      inputPenjualan.value = akhir - awal;
    } else {
      inputPenjualan.value = "";
    }
  }
</script>

</body>
</html>
